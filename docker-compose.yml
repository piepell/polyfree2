version: '3.8'

services:
  # CPU-only backend (fallback)
  photogrammetry-cpu:
    build:
      context: .
      target: cpu
    container_name: photogrammetry-cpu
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/outputs:/data/outputs
      - ./app:/app/app:ro
      - ./temp:/tmp/photogrammetry
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      - POLYFREE_ENGINE_PATH=/opt/polyfree/bin/polyfree_pipeline
      - POLYFREE_LIB_PATH=/opt/polyfree/lib/libpolyfree_core.a

  # Reverse proxy with Caddy (auto HTTPS via Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    container_name: photogrammetry-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - photogrammetry-cpu
    restart: unless-stopped

volumes:
  uploads:
  outputs:
  caddy_data:
  caddy_config:

networks:
  default:
    name: photogrammetry-net